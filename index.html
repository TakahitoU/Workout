<meta charset="utf-8" />
<title>筋トレ記録</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="筋トレ記録" />
<meta name="theme-color" content="#141210" />
<link rel="apple-touch-icon" href="icon.png" />
<style>
  :root{
    --bg:#141210; --surface:#1F1C17; --surface2:#2A261F; --line:#3A342B;
    --text:#F3EEE5; --dim:#A39A8C; --faint:#6F665A;
    --ember:#FF6B30; --ember-dim:rgba(255,107,48,.16);
    --up:#5FD68A; --down:#D08A66; --gold:#E8B84B;
    --font-ui:-apple-system,system-ui,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
    --font-num:ui-monospace,"SF Mono",Menlo,monospace;
    --tabbar-h:62px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:var(--font-ui); background:var(--bg); color:var(--text); line-height:1.5;
    max-width:560px; margin:0 auto; padding:0 14px calc(150px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

  /* top bar */
  header{position:sticky;top:0;z-index:20;margin:0 -14px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    background:rgba(20,18,16,.72);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);
    border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--ember);box-shadow:0 0 10px var(--ember);align-self:center}
  .brand h1{font-size:17px;font-weight:800;margin:0;letter-spacing:.01em}
  .brand .tag{font-size:11.5px;color:var(--faint);font-weight:600}

  #view{animation:fade .2s ease}

  /* log controls */
  .controls{display:flex;gap:8px;align-items:center;margin:14px 0 0}
  .date-in{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);color:var(--text);
    font-family:var(--font-num);font-size:14px;padding:10px 12px;border-radius:12px;min-height:44px}
  .modes{flex:1;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
  .modes button{flex:1;padding:9px 0;border:0;background:transparent;color:var(--dim);font-weight:700;font-size:13px;
    border-radius:9px;font-family:var(--font-ui);transition:.15s}
  .modes button.on{background:var(--ember);color:#1a0b04;box-shadow:0 2px 8px rgba(255,107,48,.35)}
  .mstrip{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:13px 15px;margin-top:16px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
  .streak{flex:1;min-width:0}
  .streak .flame{font-size:18px;margin-right:1px}
  .streak .sv{font-family:var(--font-num);font-size:26px;font-weight:800;color:var(--text);vertical-align:-2px}
  .streak .sl{font-size:13px;color:var(--dim);font-weight:700;margin-left:3px}
  .streak .sl0{font-size:14px;color:var(--text);font-weight:700}
  .streak .ssub{font-size:11px;color:var(--faint);margin-top:3px}
  .rings{display:flex;gap:14px}
  .ring{text-align:center}
  .ring svg{width:46px;height:46px;display:block;margin:0 auto}
  .ring .rbg{fill:none;stroke:var(--surface2);stroke-width:4}
  .ring .rfg{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dasharray .5s}
  .ring .rtx{font-family:var(--font-num);font-size:13px;font-weight:800;fill:var(--text);text-anchor:middle}
  .ring .rl{font-size:10px;color:var(--faint);margin-top:2px;font-weight:600;white-space:nowrap}
  .pr{color:var(--gold);font-weight:700;margin-left:6px;font-size:11px}

  /* progress */
  .prog{margin:15px 2px 4px}
  .prog-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .prog-row .t{font-size:12px;color:var(--dim);font-weight:600}
  .prog-row .n{font-family:var(--font-num);font-size:13px;color:var(--text);font-weight:700}
  .prog-track{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--ember),#FF9460);border-radius:99px;width:0;transition:width .35s cubic-bezier(.4,0,.2,1)}
  .menu-note{color:var(--faint);font-size:12px;margin:10px 2px 16px;line-height:1.6}

  /* card */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 6px 18px rgba(0,0,0,.22);transition:border-color .2s,background .2s}
  .card.done{border-color:rgba(95,214,138,.35);background:linear-gradient(var(--surface),rgba(95,214,138,.04))}
  .card-head{display:flex;align-items:flex-start;gap:11px}
  .num{font-family:var(--font-num);font-size:12px;color:var(--faint);min-width:20px;padding-top:4px}
  .card-title{flex:1;min-width:0}
  .card-title .name{font-weight:700;font-size:16px}
  .card-title .sub{color:var(--dim);font-size:12px;margin-top:1px}
  .target{color:var(--ember);font-size:12px;font-weight:600;margin-top:7px;font-family:var(--font-num)}
  .check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;transition:.2s}
  .check svg{width:15px;height:15px;stroke:transparent;transition:.2s}
  .check.on{border-color:var(--up);background:var(--up)}
  .check.on svg{stroke:#0d1a12;animation:pop .25s ease}
  .badge{display:none;align-items:center;gap:6px;margin-top:10px;background:rgba(232,184,75,.12);
    border:1px solid rgba(232,184,75,.4);color:var(--gold);font-size:12px;font-weight:700;padding:7px 11px;border-radius:10px}
  .badge.show{display:inline-flex}
  .card-head{cursor:pointer}
  .summary{color:var(--dim);font-size:12.5px;margin-top:3px;font-family:var(--font-num)}
  .cardchev{color:var(--faint);font-size:13px;align-self:center;transition:transform .2s;flex:none}
  .card.open .cardchev{transform:rotate(90deg)}
  .card-body{display:none}
  .card.open .card-body{display:block;animation:fade .18s ease}
  .sub-target{margin:12px 0 2px}
  .sub-target .sub{color:var(--dim);font-size:12px}

  /* sets */
  .sets{margin-top:13px;display:flex;flex-direction:column;gap:9px}
  .set{background:var(--surface2);border-radius:13px;padding:11px}
  .set-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .set-label{font-size:13px;font-weight:700;color:var(--dim)}
  .set-label b{color:var(--text);font-family:var(--font-num);font-size:15px;margin-right:2px}
  .set-last{font-size:12px;color:var(--faint);font-family:var(--font-num)}
  .set-last .lt{color:var(--dim)}
  .delta{font-weight:700;margin-left:6px}
  .delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.same{color:var(--dim)}
  .ins{display:flex;align-items:center;gap:8px}
  .field{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
  .stepper{flex:1;display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:11px;overflow:hidden;min-width:0}
  .stepper button{width:34px;height:46px;border:0;background:transparent;color:var(--ember);font-size:22px;font-weight:600;flex:none;transition:.1s}
  .stepper button:active{background:var(--ember-dim)}
  .stepper input{flex:1;width:100%;min-width:0;border:0;background:transparent;text-align:center;color:var(--text);
    font-family:var(--font-num);font-size:17px;height:46px;padding:0 2px}
  .stepper input:focus{outline:none}
  .field .u{color:var(--faint);font-size:12px;flex:none}
  .ins .x{color:var(--faint);font-size:15px;flex:none}
  .set-rt{display:flex;align-items:center;gap:8px}
  .rm{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
    color:var(--faint);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .rm:active{background:var(--surface2)}
  .addset{width:100%;margin-top:10px;background:transparent;border:1px dashed var(--line);color:var(--ember);
    font-size:13px;font-weight:700;padding:11px;border-radius:11px;font-family:var(--font-ui);cursor:pointer}
  .addset:active{background:var(--ember-dim)}
  .qfill{flex:none;background:var(--ember);color:#1a0b04;border:0;border-radius:10px;
    padding:10px 14px;font-size:15px;font-weight:800;font-family:var(--font-num);
    min-height:46px;white-space:nowrap;box-shadow:0 2px 8px rgba(255,107,48,.35);transition:transform .08s}
  .qfill:active{transform:scale(.94)}

  .cues-toggle{margin-top:12px;background:none;border:0;color:var(--dim);font-size:12.5px;font-weight:600;
    padding:5px 0;display:flex;align-items:center;gap:6px;font-family:var(--font-ui)}
  .cues-toggle .chev{transition:transform .18s;display:inline-block}
  .cues{display:none;margin-top:8px;padding:12px;background:var(--bg);border-radius:12px;border:1px solid var(--line)}
  .cues.open{display:block}
  .cues ul{margin:0;padding-left:18px}
  .cues li{font-size:12.5px;color:var(--dim);margin:4px 0}
  .anim{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:8px;margin-bottom:14px;display:flex;justify-content:center}
  .anim svg{width:170px;height:108px}
  .anim .fig{stroke:var(--dim);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .anim .act{stroke:var(--ember);stroke-width:3.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .anim .eq{stroke:var(--faint);stroke-width:2;fill:none;stroke-linecap:round}
  .anim .gnd{stroke:var(--line);stroke-width:2}
  .anim .hd{fill:var(--dim);stroke:none}
  .how-steps{counter-reset:s;margin:0;padding:0;list-style:none}
  .how-steps li{position:relative;padding-left:27px;margin:8px 0;font-size:13px;color:var(--text);line-height:1.55}
  .how-steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:19px;height:19px;border-radius:50%;background:var(--ember-dim);color:var(--ember);font-size:11px;font-weight:700;font-family:var(--font-num);display:flex;align-items:center;justify-content:center}
  .how-cues{margin-top:14px}
  .how-cues .lab{font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.08em;margin-bottom:4px}
  .video-link{display:inline-flex;align-items:center;gap:5px;margin-top:14px;color:var(--ember);font-size:12.5px;font-weight:700;text-decoration:none}

  /* save bar (above tab bar) */
  .savebar{position:fixed;left:0;right:0;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom));z-index:25;
    max-width:560px;margin:0 auto;padding:10px 14px 10px;
    background:linear-gradient(transparent,var(--bg) 32%)}
  .save{width:100%;border:0;border-radius:15px;padding:16px;font-size:16px;font-weight:800;font-family:var(--font-ui);
    background:var(--ember);color:#1a0b04;box-shadow:0 6px 20px rgba(255,107,48,.4);transition:transform .08s}
  .save:active{transform:translateY(2px) scale(.99)}

  /* bottom tab bar */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:560px;margin:0 auto;
    display:flex;background:rgba(20,18,16,.82);backdrop-filter:saturate(160%) blur(20px);-webkit-backdrop-filter:saturate(160%) blur(20px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tb{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 0 8px;color:var(--faint);font-size:11px;font-weight:700;font-family:var(--font-ui);transition:color .15s}
  .tb svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tb.on{color:var(--ember)}

  .toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + 30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
    z-index:40;background:var(--text);color:var(--bg);font-weight:700;font-size:14px;padding:11px 18px;border-radius:30px;
    opacity:0;transition:.25s;pointer-events:none;max-width:88%;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .celebrate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:rgba(10,8,6,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .25s}
  .celebrate.show{opacity:1;pointer-events:auto}
  .cel-card{background:linear-gradient(var(--surface),var(--surface2));border:1px solid var(--line);border-radius:22px;
    padding:26px 28px;text-align:center;max-width:82%;box-shadow:0 20px 50px rgba(0,0,0,.5);
    transform:scale(.85);transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
  .celebrate.show .cel-card{transform:scale(1)}
  .cel-big{font-size:24px;font-weight:800;color:var(--ember)}
  .cel-sub{font-size:13px;color:var(--dim);margin-top:4px}
  .cel-stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
  .cel-stats span{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:700;color:var(--text);font-family:var(--font-num)}

  /* history */
  .hist-head{margin:16px 2px 12px;font-size:13px;color:var(--dim);font-weight:700}
  .hist-empty{text-align:center;color:var(--faint);padding:48px 20px;font-size:14px;line-height:1.7}
  .hist-empty .big{font-size:15px;color:var(--dim);margin-bottom:6px;font-weight:700}
  .hsession{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:11px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.2)}
  .hhead{display:flex;align-items:center;gap:10px;padding:15px}
  .hdate{font-family:var(--font-num);font-weight:700;font-size:15px}
  .htype{font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px}
  .htype.gym{background:var(--ember-dim);color:var(--ember)}
  .htype.home{background:rgba(95,214,138,.14);color:var(--up)}
  .hmeta{margin-left:auto;color:var(--faint);font-size:12px;font-family:var(--font-num)}
  .hbody{display:none;padding:0 15px 8px}
  .hbody.open{display:block}
  .hex{padding:10px 0;border-top:1px solid var(--line)}
  .hex .hn{font-size:13.5px;font-weight:600;margin-bottom:3px}
  .hex .hs{font-family:var(--font-num);font-size:13px;color:var(--dim)}
  .hdel{margin:2px 15px 15px;background:none;border:1px solid var(--line);color:var(--down);
    font-size:12px;font-weight:600;padding:8px 13px;border-radius:10px;font-family:var(--font-ui)}

  .sync{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:24px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
  .sync-h{font-weight:700;font-size:15px}
  .sync-desc{color:var(--faint);font-size:12px;margin:5px 0 13px;line-height:1.6}
  .sync-l{display:block;font-size:12px;color:var(--dim);font-weight:600;margin:11px 0 5px}
  .sync-i{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:11px 12px;font-size:13px;font-family:var(--font-num);min-height:44px}
  .sync-i:focus{outline:none;border-color:var(--ember)}
  .sync-row{display:flex;gap:8px;margin-top:14px}
  .sync-row .exp{flex:1}
  .sync-status{color:var(--faint);font-size:11.5px;font-family:var(--font-num);margin-top:12px;text-align:center}
  .sync-test{display:block;margin:11px auto 0;background:none;border:0;color:var(--ember);font-size:12.5px;font-weight:600;text-decoration:underline;font-family:var(--font-ui)}

  .footer{margin-top:22px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
  .exp{background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:700;
    padding:12px 18px;border-radius:12px;font-family:var(--font-ui);transition:transform .08s}
  .exp:active{transform:translateY(1px)}
  .reset{background:none;border:0;color:var(--faint);font-size:12px;text-decoration:underline;font-family:var(--font-ui)}
  .loading{text-align:center;color:var(--faint);padding:56px;font-size:14px}
  .ana-kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
  .kpi .v{font-family:var(--font-num);font-size:22px;font-weight:800;color:var(--text)}
  .kpi .v .u{font-size:12px;color:var(--faint);font-weight:600;margin-left:2px}
  .kpi .l{font-size:11.5px;color:var(--dim);margin-top:2px}
  .ana-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
  .ana-card h3{font-size:14px;margin:0 0 2px}
  .ana-sub{font-size:11.5px;color:var(--faint);margin-bottom:12px}
  .ana-select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font-size:14px;font-family:var(--font-ui);min-height:44px;margin-bottom:12px}
  .chart-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .chart-meta .big{font-family:var(--font-num);font-size:22px;font-weight:800}
  .chart-meta .delta{font-size:12px;font-weight:700;color:var(--dim)}
  .chart-meta .delta.up{color:var(--up)} .chart-meta .delta.down{color:var(--down)}
  .linechart{width:100%;height:auto;display:block}
  .linechart .ln{fill:none;stroke:var(--ember);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
  .linechart .dot{fill:var(--ember)}
  .linechart .axt{fill:var(--faint);font-size:10px;font-family:var(--font-num)}
  .linechart .grid{stroke:var(--line);stroke-width:1}
  .heat{display:block;margin:6px auto 0}
  .heat .cell.n{fill:var(--surface2)} .heat .cell.g{fill:var(--ember)} .heat .cell.h{fill:var(--up)}
  .heat-legend{display:flex;gap:14px;justify-content:center;margin-top:11px;font-size:11px;color:var(--dim)}
  .heat-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .bars{display:flex;flex-direction:column;gap:11px}
  .bar-row{display:grid;grid-template-columns:40px 1fr 32px;align-items:center;gap:10px}
  .bar-row .bl{font-size:13px;color:var(--dim);font-weight:600}
  .bar-track{height:14px;background:var(--surface2);border-radius:99px;overflow:hidden}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--ember),#FF9460);border-radius:99px;transition:width .4s}
  .bar-row .bv{font-family:var(--font-num);font-size:12px;color:var(--text);text-align:right}
  .ana-empty{text-align:center;color:var(--faint);padding:48px 20px;font-size:14px;line-height:1.7}
  .ana-empty .big{font-size:15px;color:var(--dim);margin-bottom:6px;font-weight:700}
</style>

<header>
  <div class="brand"><span class="dot"></span><h1>トレーニング記録</h1><span class="tag">前回より少しだけ</span></div>
</header>

<main id="view"><div class="loading">読み込み中…</div></main>

<div class="savebar" id="savebar" style="display:none">
  <button class="save" id="saveBtn">この日の記録を保存</button>
</div>

<nav class="tabbar">
  <button class="tb on" id="tabLog" data-tab="log">
    <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg>
    <span>記録</span>
  </button>
  <button class="tb" id="tabHist" data-tab="hist">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span>履歴</span>
  </button>
  <button class="tb" id="tabAna" data-tab="ana">
    <svg viewBox="0 0 24 24"><path d="M3 21h18M6 21v-6M12 21V9M18 21v-9"/></svg>
    <span>分析</span>

  dead_bug:{anim:"deadbug",how:["仰向けで膝を90度に上げ、両手を天井へ伸ばす","腰を床に押し付けたまま保つ","対角の手と足（右手と左足）を同時にゆっくり下ろす","元に戻し、反対側も同様に交互に行う（腰を浮かせない）"]},
  narrow_pushup:{anim:"pushup",how:["通常の腕立てより手幅を狭くして床につく","頭から踵まで一直線を保つ","肘を開きすぎず、体の近くを通して下ろす","きつければ膝をついて行う"]},
  plank:{anim:"plank",how:["肘を肩の真下につき、つま先で支える","頭・背中・腰・踵を一直線にする","腰を反らさず、お尻を上げすぎない","呼吸を止めず、その姿勢を時間キープ"]}

//// 部位マッピング（分析の部位別バランス用） ////
const MUSCLE={smith_bench:"胸",incline:"胸",fly:"胸",pushup:"胸",lat_pulldown:"背",reverse_snow:"背",leg_press:"脚",side_raise:"肩",triceps_pushdown:"腕",ez_curl:"腕",hammer_curl:"腕",oh_triceps:"腕",narrow_pushup:"腕",abs:"体幹",dead_bug:"体幹",plank:"体幹"};

//// コア種目（時短の日に残す種目）と月目標 ////
const CORE_IDS=["smith_bench","incline","lat_pulldown","triceps_pushdown","ez_curl","hammer_curl"];
const GOAL={gym:4,home:2};

//// 状態 ////
const S_SESS="wlog_sessions", S_DRAFT="wlog_draft", S_SYNC="wlog_sync";
let sessions=[];
let draft={gym:{date:today(),entries:{}},home:{date:today(),entries:{}}};
let curTab="log", curType="gym", gymMode="full", saveTimer=null, tT=null, anaEx=null;

function today(){const d=new Date();const o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function num(v){if(v===""||v==null)return null;const n=parseFloat(v);return isNaN(n)?null:n;}
function fmt(n){return n==null?"–":n;}
const CHECK=`<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>`;

//// ストレージ ////
function loadAll(){
  try{const v=localStorage.getItem(S_SESS);if(v)sessions=JSON.parse(v);}catch(e){sessions=[];}
  try{const v=localStorage.getItem(S_DRAFT);if(v){const d=JSON.parse(v);if(d&&d.gym&&d.home)draft=d;}}catch(e){}
}
function saveSessions(){try{localStorage.setItem(S_SESS,JSON.stringify(sessions));}catch(e){toast("保存に失敗しました");}}
function queueDraftSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(S_DRAFT,JSON.stringify(draft));}catch(e){}},400);}

//// 前回記録 ////
function lastFor(exId,type){for(const s of sessions){if(s.type!==type)continue;const e=s.entries.find(x=>x.exId===exId);if(e)return e.sets;}return null;}

//// 描画 ////
//// 継続・モチベーション ////
function shownEx(){
  if(curType==="home") return PLANS.home.ex;
  return gymMode==="core" ? PLANS.gym.ex.filter(e=>CORE_IDS.includes(e.id)) : PLANS.gym.ex;
}
function weekIdx(dateStr){const d=new Date(dateStr+"T00:00:00");const s=new Date(d);s.setDate(d.getDate()-d.getDay());return Math.round(s.getTime()/(7*86400000));}
function weekStreak(){
  const idxs=new Set(sessions.map(s=>weekIdx(s.date)));
  if(!idxs.size) return 0;
  const cw=weekIdx(today());
  let w=idxs.has(cw)?cw:cw-1, count=0, gap=false;
  while(cw-w<=520){
    if(idxs.has(w)){count++;gap=false;}
    else{ if(gap) break; gap=true; }
    w--;
  }
  return count;
}
function ringSVG(val,max,label,color){
  const r=14,c=2*Math.PI*r,frac=Math.max(0,Math.min(1,val/max));
  return `<div class="ring">
    <svg viewBox="0 0 36 36"><circle class="rbg" cx="18" cy="18" r="${r}"/><circle class="rfg" cx="18" cy="18" r="${r}" style="stroke:${color}" stroke-dasharray="${(frac*c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 18 18)"/><text x="18" y="22" class="rtx">${val}</text></svg>
    <div class="rl">${label} ${val}/${max}</div>
  </div>`;
}
function motivStrip(){
  const s=weekStreak(), mp=today().slice(0,7);
  const gym=sessions.filter(x=>x.type==="gym"&&x.date.slice(0,7)===mp).length;
  const home=sessions.filter(x=>x.type==="home"&&x.date.slice(0,7)===mp).length;
  const trainedThis=sessions.some(x=>weekIdx(x.date)===weekIdx(today()));
  const head = s>=1 ? `<span class="flame">🔥</span><span class="sv">${s}</span><span class="sl">週連続</span>` : `<span class="sl0">今週から始めよう</span>`;
  const sub = s>=1 ? (trainedThis?"今週はクリア済み":`今週やれば ${s+1}週連続に`) : (trainedThis?"今週クリア！":"まずは1回でOK");
  return `<div class="mstrip">
    <div class="streak">${head}<div class="ssub">${sub}</div></div>
    <div class="rings">${ringSVG(gym,GOAL.gym,"ジム","var(--ember)")}${ringSVG(home,GOAL.home,"家トレ","var(--up)")}</div>
  </div>`;
}
function countPRs(sess){
  let k=0;
  sess.entries.forEach(e=>{
    if(!e.weight) return;
    const ws=e.sets.map(st=>st.w).filter(w=>w!=null); if(!ws.length) return;
    const cur=Math.max(...ws); let prev=-Infinity;
    sessions.forEach(s=>{if(s.type!==sess.type)return;const pe=s.entries.find(x=>x.exId===e.exId);if(pe)pe.sets.forEach(st=>{if(st.w!=null&&st.w>prev)prev=st.w;});});
    if(prev>-Infinity&&cur>prev) k++;
  });
  return k;
}
function showCelebration(st){
  const el=document.getElementById("celebrate"); if(!el) return;
  const lines=[`今月 ${st.monthCount}回目`];
  if(st.streak>=1) lines.push(`🔥 ${st.streak}週連続`);
  if(st.prs>0) lines.push(`自己ベスト更新 ×${st.prs}`);
  lines.push(`通算 ${st.total}回`);
  el.querySelector(".cel-card").innerHTML=`<div class="cel-big">おつかれさま！</div><div class="cel-sub">今日のトレを記録しました</div><div class="cel-stats">${lines.map(l=>`<span>${l}</span>`).join("")}</div>`;
  el.classList.add("show");
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2800);
}

function render(){
  document.getElementById("savebar").style.display = curTab==="log" ? "block" : "none";
  document.querySelectorAll(".tb").forEach(b=>b.classList.toggle("on", b.dataset.tab===curTab));
  const v=document.getElementById("view");
  v.style.animation="none"; void v.offsetWidth; v.style.animation="";
  v.innerHTML = curTab==="log" ? renderLog() : curTab==="hist" ? renderHist() : renderAnalytics();
  if(curTab==="log"){
    bindLog();
    document.querySelectorAll(".card").forEach(c=>refreshCard(c));
    const cards=[...document.querySelectorAll(".card")];
    const openT=cards.find(c=>!c.classList.contains("done"))||cards[0];
    if(openT) openT.classList.add("open");
    updateProgress(); updateSaveBtn();
  }
  else if(curTab==="hist") bindHist();
  else bindAnalytics();
}

function renderLog(){
  const list=shownEx();
  const note = curType==="home" ? PLANS.home.note : (gymMode==="core" ? "コア：残したい種目だけ。時短の日もこれで“完了”でOK。" : PLANS.gym.note);
  let h=`${motivStrip()}
  <div class="controls">
    <input type="date" id="dateInput" class="date-in" value="${esc(draft[curType].date)}">
    <div class="modes">
      <button data-mode="full" class="${curType==="gym"&&gymMode==="full"?"on":""}">フル</button>
      <button data-mode="core" class="${curType==="gym"&&gymMode==="core"?"on":""}">コア</button>
      <button data-mode="home" class="${curType==="home"?"on":""}">家トレ</button>
    </div>
  </div>
  <div class="prog">
    <div class="prog-row"><span class="t">今日の記録</span><span class="n" id="progNum">0 / ${list.length} 種目</span></div>
    <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
  </div>
  <div class="menu-note">${esc(note)}</div>`;
  list.forEach((ex,i)=>{
    const last=lastFor(ex.id,curType);
    h+=`<div class="card" data-ex="${ex.id}">
      <div class="card-head">
        <div class="num">${String(i+1).padStart(2,"0")}</div>
        <div class="card-title">
          <div class="name">${esc(ex.name)}</div>
          <div class="summary"></div>
        </div>
        <div class="check">${CHECK}</div>
        <span class="cardchev">▸</span>
      </div>
      <div class="card-body">
        <div class="sub-target"><span class="sub">${esc(ex.sub)}</span><div class="target">${esc(ex.target)}</div></div>
        <div class="badge"><span>★</span><span class="badge-txt"></span></div>
        <div class="sets">${setRows(ex,last)}</div>
        <button class="cues-toggle"><span class="chev">▸</span>やり方とコツを見る</button>
        <div class="cues">
          <div class="anim">${ANIM[HOW[ex.id].anim]||""}</div>
          <ol class="how-steps">${HOW[ex.id].how.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
          <div class="how-cues"><div class="lab">フォームのコツ</div><ul>${ex.cues.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>
          <a class="video-link" href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name+" やり方")}" target="_blank" rel="noopener">▶ 動画で見る（YouTube）</a>
        </div>
      </div>
    </div>`;
  });
  return h;
}

function setRows(ex,last){
  const d=draft[curType].entries[ex.id]||(draft[curType].entries[ex.id]=[]);
  if(d.length===0) d.push({});
  if(ex.weight){
    d.forEach((row,i)=>{
      if(row.w===undefined){
        const lt=last&&last[i]?last[i]:null, prev=i>0?d[i-1]:null;
        row.w = lt?lt.w : (prev&&prev.w!=null?prev.w : (WDEF[ex.id]!=null?WDEF[ex.id]:null));
      }
    });
  }
  const lab=curType==="home"?"周":"セット";
  const n=d.length;
  let h="";
  for(let i=0;i<n;i++){
    const cur=d[i]||{}, lt=last&&last[i]?last[i]:null;
    let ltTxt=""; if(lt) ltTxt = ex.weight ? `${fmt(lt.w)}×${fmt(lt.r)}` : `${fmt(lt.r)}${ex.unit}`;
    const rm = n>1 ? `<button class="rm" data-i="${i}">×</button>` : "";
    const wField = ex.weight ? `<div class="field">
        <div class="stepper">
          <button data-f="w" data-i="${i}" data-dir="-1">−</button>
          <input inputmode="decimal" data-f="w" data-i="${i}" value="${cur.w??""}" placeholder="${lt?fmt(lt.w):"–"}">
          <button data-f="w" data-i="${i}" data-dir="1">＋</button>
        </div><span class="u">kg</span>
      </div><span class="x">×</span>` : "";
    const qr = (lt&&lt.r!=null) ? lt.r : (RDEF[ex.id]!=null?RDEF[ex.id]:null);
    const qfill = (cur.r==null && qr!=null) ? `<button class="qfill" data-i="${i}" data-v="${qr}">${qr}${ex.unit==="秒"?"秒":"回"}</button>` : "";
    h+=`<div class="set" data-i="${i}">
      <div class="set-top">
        <div class="set-label"><b>${i+1}</b>${lab}目</div>
        <div class="set-rt"><div class="set-last">${lt?`<span class="lt">前回 ${ltTxt}</span><span class="delta"></span><span class="pr"></span>`:`<span class="lt">前回なし</span>`}</div>${rm}</div>
      </div>
      <div class="ins">
        ${wField}
        <div class="field">
          <div class="stepper">
            <button data-f="r" data-i="${i}" data-dir="-1">−</button>
            <input inputmode="numeric" data-f="r" data-i="${i}" value="${cur.r??""}" placeholder="${qr||"–"}">
            <button data-f="r" data-i="${i}" data-dir="1">＋</button>
          </div><span class="u">${ex.unit==="秒"?"秒":"回"}</span>
        </div>
        ${qfill}
      </div>
    </div>`;
  }
  h+=`<button class="addset">＋ ${curType==="home"?"周":"セット"}を追加</button>`;
  return h;
}

function bindLog(){
  const di=document.getElementById("dateInput");
  if(di) di.addEventListener("change",e=>{draft[curType].date=e.target.value||today();queueDraftSave();});
  document.querySelectorAll(".modes button").forEach(b=>b.addEventListener("click",()=>{
    const m=b.dataset.mode;
    if(m==="home") curType="home"; else { curType="gym"; gymMode=m; }
    render();
  }));
  document.querySelectorAll(".card-head").forEach(hd=>hd.addEventListener("click",()=>{
    const card=hd.closest(".card"), willOpen=!card.classList.contains("open");
    document.querySelectorAll(".card.open").forEach(c=>{if(c!==card)c.classList.remove("open");});
    card.classList.toggle("open",willOpen);
    if(willOpen){const top=card.getBoundingClientRect().top+window.scrollY-90;window.scrollTo({top,behavior:"smooth"});}
  }));
  document.querySelectorAll(".cues-toggle").forEach(b=>b.addEventListener("click",()=>{
    const c=b.parentElement.querySelector(".cues");const open=c.classList.toggle("open");
    b.querySelector(".chev").style.transform=open?"rotate(90deg)":"";
  }));
  document.querySelectorAll(".card").forEach(c=>bindCardSets(c));
}

function rebuildSets(card,ex,last){
  card.querySelector(".sets").innerHTML=setRows(ex,last);
  bindCardSets(card);
  refreshCard(card); updateProgress(); updateSaveBtn();
}
function bindCardSets(card){
  const exId=card.dataset.ex, ex=PLANS[curType].ex.find(x=>x.id===exId);
  const last=lastFor(exId,curType);
  card.querySelectorAll("input[data-f]").forEach(inp=>{
    inp.addEventListener("input",()=>{
      const i=+inp.dataset.i,f=inp.dataset.f;
      const arr=draft[curType].entries[exId]||(draft[curType].entries[exId]=[]);
      arr[i]=arr[i]||{}; arr[i][f]=num(inp.value);
      refreshCard(card); updateProgress(); updateSaveBtn(); queueDraftSave();
    });
  });
  card.querySelectorAll(".stepper button").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const i=+btn.dataset.i,f=btn.dataset.f,dir=+btn.dataset.dir;
      const lt=last&&last[i]?last[i]:null;
      const arr=draft[curType].entries[exId]||(draft[curType].entries[exId]=[]);
      arr[i]=arr[i]||{};
      const step = f==="w" ? (WSTEP[exId]||2.5) : (ex.unit==="秒"?5:1);
      const cur=arr[i][f], lastV=lt!=null?(f==="w"?lt.w:lt.r):null;
      let nv;
      if(cur==null) nv = (lastV!=null) ? lastV : Math.max(0, dir>0?step:0);
      else nv = Math.max(0, cur + dir*step);
      nv=Math.round(nv*100)/100; arr[i][f]=nv;
      const inp=card.querySelector(`input[data-f="${f}"][data-i="${i}"]`); if(inp) inp.value=nv;
      refreshCard(card); updateProgress(); updateSaveBtn(); queueDraftSave();
    });
  });
  const add=card.querySelector(".addset");
  if(add) add.addEventListener("click",()=>{
    const arr=draft[curType].entries[exId]||(draft[curType].entries[exId]=[]);
    arr.push({});
    rebuildSets(card,ex,last); queueDraftSave();
  });
  card.querySelectorAll(".rm").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.i, arr=draft[curType].entries[exId]||[];
    if(arr.length>1){ arr.splice(i,1); rebuildSets(card,ex,last); queueDraftSave(); }
  }));
  card.querySelectorAll(".qfill").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.i, v=+b.dataset.v;
    const arr=draft[curType].entries[exId]||(draft[curType].entries[exId]=[]);
    arr[i]=arr[i]||{}; arr[i].r=v;
    rebuildSets(card,ex,last); queueDraftSave();
  }));
}

function exDone(ex,arr){if(!arr||!arr.length)return false;for(let i=0;i<arr.length;i++){if(!(arr[i]&&arr[i].r!=null))return false;}return true;}

function refreshCard(card){
  const exId=card.dataset.ex, ex=PLANS[curType].ex.find(x=>x.id===exId);
  const last=lastFor(exId,curType), arr=draft[curType].entries[exId]||[];
  let prevBest=-Infinity;
  sessions.forEach(s=>{if(s.type!==curType)return;const e=s.entries.find(x=>x.exId===exId);if(e)e.sets.forEach(st=>{if(st.w!=null&&st.w>prevBest)prevBest=st.w;});});
  // per-set delta + 自己ベスト
  card.querySelectorAll(".set").forEach(setEl=>{
    const i=+setEl.dataset.i, delta=setEl.querySelector(".delta"); if(!delta)return;
    const cur=arr[i]||{}, lt=last&&last[i]?last[i]:null, curR=cur.r, ltR=lt?lt.r:null;
    delta.className="delta"; delta.textContent="";
    if(curR!=null&&ltR!=null){
      const wUp=ex.weight&&cur.w!=null&&lt.w!=null&&cur.w>lt.w;
      const wDown=ex.weight&&cur.w!=null&&lt.w!=null&&cur.w<lt.w;
      if(wUp||curR>ltR){delta.classList.add("up");delta.textContent="↑";}
      else if(wDown||curR<ltR){delta.classList.add("down");delta.textContent="↓";}
      else{delta.classList.add("same");delta.textContent="→";}
    }
    const pr=setEl.querySelector(".pr");
    if(pr){ pr.textContent = (ex.weight&&cur.w!=null&&curR!=null&&prevBest>-Infinity&&cur.w>prevBest) ? "★最高" : ""; }
  });
  // completion
  const done=exDone(ex,arr);
  card.classList.toggle("done",done);
  const chk=card.querySelector(".check"); if(chk) chk.classList.toggle("on",done);
  // collapsed summary
  const sum=card.querySelector(".summary");
  if(sum){
    const vals=[];
    for(let i=0;i<ex.sets;i++){const s=arr[i]; if(s&&s.r!=null) vals.push(ex.weight?`${fmt(s.w)}×${fmt(s.r)}`:`${fmt(s.r)}${ex.unit}`);}
    sum.textContent = vals.length ? vals.join(" / ") : "—";
  }
  // level-up badge
  const badge=card.querySelector(".badge"), txt=card.querySelector(".badge-txt");
  if(ex.levelUp){
    const reps=arr.filter(s=>s&&s.r!=null).map(s=>s.r);
    const hit = reps.filter(r=>r>=ex.levelUp.reps).length >= ex.sets;
    if(hit){badge.classList.add("show");txt.textContent=ex.levelUp.note;} else badge.classList.remove("show");
  }
}

function updateProgress(){
  const list=shownEx(), ents=draft[curType].entries;
  let done=0; list.forEach(ex=>{ if(exDone(ex,ents[ex.id]||[])) done++; });
  const fill=document.getElementById("progFill"), n=document.getElementById("progNum");
  if(fill) fill.style.width=(done/list.length*100)+"%";
  if(n) n.textContent=`${done} / ${list.length} 種目`;
}

function entriesFilled(type){const e=type?draft[type].entries:draft[curType].entries;let n=0;for(const id in e){if((e[id]||[]).some(s=>s&&s.r!=null))n++;}return n;}
function updateSaveBtn(){
  const btn=document.getElementById("saveBtn"); if(!btn)return;
  const n=entriesFilled(curType);
  const bar=document.getElementById("savebar");
  bar.style.display = (curTab==="log"&&n>0) ? "block" : "none";
  btn.textContent = `今日のトレを記録して完了（${n}種目）`;
}

//// 保存 ////
async function saveSession(){
  const type=curType, ents=draft[type].entries, entries=[];
  PLANS[type].ex.forEach(ex=>{
    const arr=ents[ex.id]||[];
    const sets=arr.filter(s=>s&&s.r!=null).map(s=>ex.weight?{w:s.w??null,r:s.r}:{r:s.r});
    if(sets.length) entries.push({exId:ex.id,name:ex.name,weight:ex.weight,unit:ex.unit,sets});
  });
  if(!entries.length){toast("入力がありません");return;}
  const sess={id:Date.now(),date:draft[type].date||today(),type,entries};
  const prs=countPRs(sess);
  sessions.unshift(sess);
  sessions.sort((a,b)=>(b.date.localeCompare(a.date))||(b.id-a.id));
  saveSessions();
  draft[type]={date:today(),entries:{}};
  queueDraftSave();
  const mp=today().slice(0,7), monthCount=sessions.filter(x=>x.date.slice(0,7)===mp).length;
  showCelebration({monthCount, streak:weekStreak(), prs, total:sessions.length});
  if(getSync().url) pushSync(true);
  render();
}

//// 履歴 ////
function renderHist(){
  let h=`<div class="hist-head">これまでの記録</div>`;
  if(!sessions.length){
    h+=`<div class="hist-empty"><div class="big">まだ記録がありません</div>記録タブで回数を入力して保存すると、ここに残ります。次回その種目の「前回」として表示されます。</div>`;
  } else {
    sessions.forEach(s=>{
      const tlabel=s.type==="gym"?"ジム":"家トレ";
      h+=`<div class="hsession" data-id="${s.id}">
        <div class="hhead">
          <span class="hdate">${esc(s.date)}</span>
          <span class="htype ${s.type}">${tlabel}</span>
          <span class="hmeta">${s.entries.length}種目 ▾</span>
        </div>
        <div class="hbody">
          ${s.entries.map(e=>{
            const line=e.sets.map(st=>e.weight?`${fmt(st.w)}×${fmt(st.r)}`:`${fmt(st.r)}${e.unit}`).join(" / ");
            return `<div class="hex"><div class="hn">${esc(e.name)}</div><div class="hs">${esc(line)}</div></div>`;
          }).join("")}
        </div>
        <button class="hdel">この記録を削除</button>
      </div>`;
    });
  }
  h+=`<div class="sync">
    <div class="sync-h">Googleスプレッドシートへ自動同期</div>
    <div class="sync-desc">記録を保存するたびにシートが自動更新されます。設定方法はチャットの手順を参照。</div>
    <label class="sync-l">Web App の URL</label>
    <input class="sync-i" id="syncUrl" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec">
    <label class="sync-l">合言葉（任意・スクリプトと同じ文字列）</label>
    <input class="sync-i" id="syncToken" placeholder="例：myworkout2026">
    <div class="sync-row">
      <button class="exp" id="syncSave">設定を保存</button>
      <button class="exp" id="syncNow">今すぐ同期</button>
    </div>
    <div class="sync-status" id="syncStatus"></div>
    <button class="sync-test" id="syncTest">接続テスト（シートに1行送る）</button>
  </div>
  <div class="footer">
    <button class="exp" id="backupBtn">💾 データをバックアップ</button>
    <button class="exp" id="restoreBtn">📂 バックアップから復元</button>
    <input type="file" id="restoreFile" accept=".json" style="display:none">
    <button class="exp" id="exportCsv">スプレッドシート用に書き出す（CSV）</button>
    <button class="reset" id="resetAll">すべてのデータを削除</button>
  </div>`;
  return h;
}
function bindHist(){
  document.querySelectorAll(".hhead").forEach(hd=>hd.addEventListener("click",()=>{
    const body=hd.parentElement.querySelector(".hbody"),open=body.classList.toggle("open");
    const m=hd.querySelector(".hmeta"); m.innerHTML=m.innerHTML.replace(/[▾▴]/,open?"▴":"▾");
  }));
  document.querySelectorAll(".hdel").forEach(b=>b.addEventListener("click",()=>{
    const id=+b.closest(".hsession").dataset.id;
    if(!confirm("この記録を削除しますか？"))return;
    sessions=sessions.filter(s=>s.id!==id); saveSessions(); render();
  }));
  const ec=document.getElementById("exportCsv"); if(ec) ec.addEventListener("click",exportCSV);
  const bb=document.getElementById("backupBtn"); if(bb) bb.addEventListener("click",backupData);

  const rf=document.getElementById("restoreFile"); if(rf) rf.addEventListener("change",restoreData);
  const cfg=getSync(), su=document.getElementById("syncUrl"), st=document.getElementById("syncToken");
  if(su) su.value=cfg.url||""; if(st) st.value=cfg.token||"";
  updateSyncStatus();
  const ss=document.getElementById("syncSave");
  if(ss) ss.addEventListener("click",()=>{const c=getSync();c.url=(su.value||"").trim();c.token=(st.value||"").trim();setSync(c);updateSyncStatus();toast("設定を保存しました");});
  const sn=document.getElementById("syncNow");
  if(sn) sn.addEventListener("click",()=>{const c=getSync();c.url=(su.value||"").trim();c.token=(st.value||"").trim();setSync(c);pushSync(false);});
  const stb=document.getElementById("syncTest"); if(stb) stb.addEventListener("click",testSync);
  const ra=document.getElementById("resetAll");
  if(ra) ra.addEventListener("click",()=>{
    if(!confirm("すべての記録と入力中のデータを削除します。元に戻せません。"))return;
    sessions=[]; draft={gym:{date:today(),entries:{}},home:{date:today(),entries:{}}};
    try{localStorage.removeItem(S_SESS);localStorage.removeItem(S_DRAFT);}catch(e){}
    render();
  });
}

//// 行データ（CSV・同期 共通） ////
function buildRows(){
  const rows=[["日付","メニュー","種目","セット","重量(kg)","値","単位"]];
  const sorted=[...sessions].sort((a,b)=>a.date.localeCompare(b.date)||(a.id-b.id));
  sorted.forEach(s=>{
    const tlabel=s.type==="gym"?"ジム":"家トレ";
    s.entries.forEach(e=>{e.sets.forEach((st,si)=>{
      rows.push([s.date,tlabel,e.name,si+1,(e.weight&&st.w!=null)?st.w:"",st.r!=null?st.r:"",e.unit]);
    });});
  });
  return rows;
}
function exportCSV(){
  if(!sessions.length){toast("記録がありません");return;}
  const csv=buildRows().map(r=>r.map(c=>{const v=String(c);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",")).join("\r\n");
  try{
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url; a.download="workout_"+today().replace(/-/g,"")+".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast("CSVを書き出しました");
  }catch(e){toast("書き出しに失敗しました");}
}

//// スプレッドシート同期 ////
function getSync(){try{const v=localStorage.getItem(S_SYNC);if(v)return JSON.parse(v);}catch(e){}return {url:"",token:"",lastSync:null};}
function setSync(c){try{localStorage.setItem(S_SYNC,JSON.stringify(c));}catch(e){}}
async function pushSync(silent){
  const cfg=getSync();
  if(!cfg.url){if(!silent)toast("同期先URLが未設定です");return;}
  if(!sessions.length){if(!silent)toast("送るデータがありません");return;}
  try{
    await fetch(cfg.url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:cfg.token||"",rows:buildRows()})});
    cfg.lastSync=new Date().toISOString(); setSync(cfg);
    if(!silent)toast("スプレッドシートへ送信しました");
    updateSyncStatus();
  }catch(e){if(!silent)toast("同期に失敗（ネット接続を確認）");}
}
async function testSync(){
  const su=document.getElementById("syncUrl"),st=document.getElementById("syncToken");
  const c=getSync(); c.url=(su.value||"").trim(); c.token=(st.value||"").trim(); setSync(c);
  if(!c.url){toast("先にURLを入力してください");return;}
  const now=new Date().toLocaleString("ja-JP");
  try{
    await fetch(c.url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:c.token||"",rows:[["接続テスト","日時"],["アプリから届きました",now]]})});
    toast("テスト送信しました。シートを確認してください");
  }catch(e){toast("送信に失敗（URLとネット接続を確認）");}
}
function updateSyncStatus(){
  const el=document.getElementById("syncStatus"); if(!el)return;
  const cfg=getSync();
  el.textContent=`同期先：${cfg.url?"設定済み":"未設定"}　最終同期：${cfg.lastSync?new Date(cfg.lastSync).toLocaleString("ja-JP"):"なし"}`;
}

//// 分析 ////
function dstr(d){const o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10);}
function kgfmt(v){return v>=1000?(v/1000).toFixed(1)+" t":Math.round(v)+" kg";}
function progFor(exId){
  const pts=[];
  [...sessions].sort((a,b)=>a.date.localeCompare(b.date)||(a.id-b.id)).forEach(s=>{
    const e=s.entries.find(x=>x.exId===exId);
    if(e){const ws=e.sets.map(st=>st.w).filter(w=>w!=null); if(ws.length) pts.push({label:s.date,v:Math.max(...ws)});}
  });
  return pts;
}
function lineChart(points){
  const W=320,H=150,pl=40,pr=14,pt=16,pb=26;
  const vals=points.map(p=>p.v); let mn=Math.min(...vals),mx=Math.max(...vals);
  if(mn===mx){mn=Math.max(0,mn-2.5);mx=mx+2.5;}
  const xf=i=>pl+(points.length===1?(W-pl-pr)/2:(i/(points.length-1))*(W-pl-pr));
  const yf=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const line=points.map((p,i)=>`${xf(i).toFixed(1)},${yf(p.v).toFixed(1)}`).join(" ");
  const dots=points.map((p,i)=>`<circle class="dot" cx="${xf(i).toFixed(1)}" cy="${yf(p.v).toFixed(1)}" r="3"/>`).join("");
  const md=s=>s.slice(5).replace("-","/");
  return `<svg class="linechart" viewBox="0 0 ${W} ${H}">
    <line class="grid" x1="${pl}" y1="${pt}" x2="${pl}" y2="${H-pb}"/>
    <line class="grid" x1="${pl}" y1="${(H-pb).toFixed(1)}" x2="${W-pr}" y2="${H-pb}"/>
    <text class="axt" x="4" y="${(yf(mx)+3).toFixed(1)}">${fmt(Math.round(mx*10)/10)}</text>
    <text class="axt" x="4" y="${(yf(mn)+3).toFixed(1)}">${fmt(Math.round(mn*10)/10)}</text>
    ${points.length>1?`<polyline class="ln" points="${line}"/>`:""}
    ${dots}
    <text class="axt" x="${pl}" y="${H-7}">${md(points[0].label)}</text>
    <text class="axt" x="${W-pr}" y="${H-7}" text-anchor="end">${md(points[points.length-1].label)}</text>
  </svg>`;
}
function heatmapSVG(){
  const WEEKS=13,C=16,S=13;
  const byDate={};
  sessions.forEach(s=>{const e=byDate[s.date]||(byDate[s.date]={g:false,h:false}); if(s.type==="gym")e.g=true; else e.h=true;});
  const end=new Date(today());
  const start=new Date(end); start.setDate(end.getDate()-((WEEKS-1)*7+end.getDay()));
  let cells="";
  for(let w=0;w<WEEKS;w++){for(let d=0;d<7;d++){
    const day=new Date(start); day.setDate(start.getDate()+w*7+d);
    if(day>end) continue;
    const rec=byDate[dstr(day)], cls=rec?(rec.g?"g":"h"):"n";
    cells+=`<rect class="cell ${cls}" x="${w*C}" y="${d*C}" width="${S}" height="${S}" rx="3"/>`;
  }}
  return `<svg class="heat" width="${WEEKS*C}" height="${7*C}" viewBox="0 0 ${WEEKS*C} ${7*C}">${cells}</svg>`;
}
function renderAnalytics(){
  let h=`<div class="hist-head">分析</div>`;
  if(!sessions.length){
    return h+`<div class="ana-empty"><div class="big">まだデータがありません</div>記録を保存していくと、ここに成長グラフ・頻度・部位別バランスが表示されます。</div>`;
  }
  // KPIs
  const now=new Date(today());
  const weekStart=new Date(now); weekStart.setDate(now.getDate()-now.getDay());
  const wk=dstr(weekStart), mp=today().slice(0,7);
  const thisWeek=sessions.filter(s=>s.date>=wk).length;
  const thisMonth=sessions.filter(s=>s.date.slice(0,7)===mp).length;
  let vol=0; sessions.forEach(s=>s.entries.forEach(e=>{if(e.weight)e.sets.forEach(st=>{if(st.w!=null&&st.r!=null)vol+=st.w*st.r;});}));
  h+=`<div class="ana-kpis">
    <div class="kpi"><div class="v">${sessions.length}<span class="u">回</span></div><div class="l">総セッション</div></div>
    <div class="kpi"><div class="v">${thisWeek}<span class="u">回</span></div><div class="l">今週</div></div>
    <div class="kpi"><div class="v">${thisMonth}<span class="u">回</span></div><div class="l">今月</div></div>
    <div class="kpi"><div class="v">${kgfmt(vol)}</div><div class="l">総挙上量</div></div>
  </div>`;
  // 種目別 重量の推移
  const withData=PLANS.gym.ex.filter(ex=>ex.weight&&progFor(ex.id).length>0);
  h+=`<div class="ana-card"><h3>種目別 重量の推移</h3>`;
  if(!withData.length){
    h+=`<div class="ana-sub">重量つきの記録がまだありません。</div>`;
  }else{
    if(!anaEx||!withData.find(e=>e.id===anaEx)) anaEx=withData[0].id;
    const pts=progFor(anaEx), first=pts[0].v, last=pts[pts.length-1].v, diff=Math.round((last-first)*10)/10;
    const dcls=diff>0?"up":(diff<0?"down":""), dtxt=diff>0?`+${diff}kg`:(diff<0?`${diff}kg`:"±0");
    h+=`<select class="ana-select" id="anaExSel">${withData.map(e=>`<option value="${e.id}" ${e.id===anaEx?"selected":""}>${esc(e.name)}</option>`).join("")}</select>
      <div class="chart-meta"><span class="big">${fmt(last)}<span style="font-size:12px;color:var(--faint);font-weight:600"> kg</span></span><span class="delta ${dcls}">最初から ${dtxt}</span></div>
      ${lineChart(pts)}
      <div class="ana-sub" style="margin:8px 0 0">各日の最大重量・${pts.length}回分</div>`;
  }
  h+=`</div>`;
  // 頻度
  const winS=(()=>{const e=new Date(today());const s=new Date(e);s.setDate(e.getDate()-90);return dstr(s);})();
  const inWin=sessions.filter(s=>s.date>=winS).length;
  h+=`<div class="ana-card"><h3>トレーニング頻度</h3><div class="ana-sub">直近13週間</div>
    ${heatmapSVG()}
    <div class="heat-legend"><span><i style="background:var(--ember)"></i>ジム</span><span><i style="background:var(--up)"></i>家トレ</span><span><i style="background:var(--surface2)"></i>休み</span></div>
    <div class="ana-sub" style="text-align:center;margin:10px 0 0">直近90日：${inWin}回</div>
  </div>`;
  // 部位別バランス
  const groups=["胸","腕","肩","背","脚","体幹"], tally={}; groups.forEach(g=>tally[g]=0);
  sessions.forEach(s=>s.entries.forEach(e=>{const g=MUSCLE[e.exId]; if(g)tally[g]+=e.sets.length;}));
  const tmx=Math.max(1,...groups.map(g=>tally[g]));
  h+=`<div class="ana-card"><h3>部位別バランス</h3><div class="ana-sub">全期間の合計セット数</div><div class="bars">
    ${groups.map(g=>`<div class="bar-row"><span class="bl">${g}</span><div class="bar-track"><div class="bar-fill" style="width:${(tally[g]/tmx*100).toFixed(1)}%"></div></div><span class="bv">${tally[g]}</span></div>`).join("")}
  </div></div>`;
  return h;
}
function bindAnalytics(){
  const sel=document.getElementById("anaExSel");
  if(sel) sel.addEventListener("change",()=>{anaEx=sel.value;render();});
}

//// バックアップ・復元 ////
function backupData(){
  const data={
    sessions: sessions,
    draft: draft,
    sync: getSync(),
    exported: new Date().toISOString(),
    version: 1
  };
  try{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"});
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download="workout_backup_"+today().replace(/-/g,"")+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast(`バックアップ完了（${sessions.length}件）`);
  }catch(e){toast("バックアップに失敗しました");}
}
function restoreData(e){
  const file=e.target.files&&e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.sessions||!Array.isArray(data.sessions)) throw new Error("invalid");
      const count=data.sessions.length;
      if(!confirm(`${count}件の記録を復元します。現在のデータは上書きされます。よろしいですか？`)) return;
      sessions=data.sessions;
      if(data.draft&&data.draft.gym&&data.draft.home) draft=data.draft;
      saveSessions(); queueDraftSave();
      if(data.sync&&data.sync.url){ setSync(data.sync); }
      toast(`${count}件の記録を復元しました`);
      render();
    }catch(err){ toast("ファイルが正しくありません"); }
  };
  reader.readAsText(file);
  e.target.value="";
}

//// toast ////
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("show"),1800);}

document.querySelectorAll(".tb").forEach(b=>b.addEventListener("click",()=>{curTab=b.dataset.tab;render();}));
document.getElementById("saveBtn").addEventListener("click",saveSession);
document.getElementById("celebrate").addEventListener("click",function(){this.classList.remove("show");});

  loadAll();
  // 入力途中（回数あり）でなければ、開いたときの日付を今日にする
  ["gym","home"].forEach(t=>{ if(!draft[t].date || entriesFilled(t)===0) draft[t].date=today(); });
  render();
})();
